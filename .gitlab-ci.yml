image: docker.m.daocloud.io/library/maven:3.9.16-eclipse-temurin-17

stages:
  - clean
  - build
  - publish
  - release

variables:
  GIT_DEPTH: "1"
  GIT_TERMINAL_PROMPT: "0"
  GIT_HTTP_LOW_SPEED_LIMIT: "1024"
  GIT_HTTP_LOW_SPEED_TIME: "60"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version --settings .mvn/settings.xml -Dmaven.wagon.http.connectionTimeout=30000 -Dmaven.wagon.http.readTimeout=60000"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  key: "maven-${CI_COMMIT_REF_SLUG}"
  paths:
    - .m2/repository/

before_script:
  - export RELEASE_VERSION="$(tr -d '\r\n' < version.txt)"
  - test -n "$RELEASE_VERSION"
  - echo "Building LeavesAntiIllegal ${RELEASE_VERSION}"

clean:
  stage: clean
  script:
    - mvn ${MAVEN_CLI_OPTS} -Drevision="$RELEASE_VERSION" clean

build:
  stage: build
  needs:
    - clean
  script:
    - mvn ${MAVEN_CLI_OPTS} -Drevision="$RELEASE_VERSION" clean package -DskipTests
    - test -f "plugin/target/LeavesAntiIllegal-${RELEASE_VERSION}.jar"
  artifacts:
    name: "LeavesAntiIllegal-${RELEASE_VERSION}"
    expire_in: 30 days
    paths:
      - "plugin/target/LeavesAntiIllegal-${RELEASE_VERSION}.jar"

publish_modrinth:
  stage: publish
  image: docker.m.daocloud.io/library/alpine:3.20
  needs:
    - job: build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  before_script:
    - sed -i 's/dl-cdn.alpinelinux.org/mirrors.aliyun.com/g' /etc/apk/repositories
    - apk add --no-cache curl jq
    - export RELEASE_VERSION="$(tr -d '\r\n' < version.txt)"
    - export RELEASE_DESCRIPTION="$(cat Description.txt)"
    - test -n "$RELEASE_VERSION"
    - test -n "$RELEASE_DESCRIPTION"
    - test -n "$MODRINTH_TOKEN"
    - test -n "$MODRINTH_PROJECT_ID"
  script:
    - export RELEASE_FILE="plugin/target/LeavesAntiIllegal-${RELEASE_VERSION}.jar"
    - test -f "$RELEASE_FILE"
    - export GAME_VERSIONS='["1.20","1.20.1","1.20.2","1.20.3","1.20.4","1.20.5","1.20.6","1.21","1.21.1","1.21.2","1.21.3","1.21.4","1.21.5","1.21.6","1.21.7","1.21.8","1.21.9","1.21.10","1.21.11","26.1","26.1.1","26.1.2","26.2"]'
    - export MODRINTH_DATA="$(jq -n --arg project "$MODRINTH_PROJECT_ID" --arg version "$RELEASE_VERSION" --arg description "$RELEASE_DESCRIPTION" --argjson game_versions "$GAME_VERSIONS" '{project_id:$project,version_number:$version,name:("LeavesAntiIllegal " + $version),version_type:"release",loaders:["bukkit"],game_versions:$game_versions,file_parts:["LeavesAntiIllegal-" + $version + ".jar"],changelog:$description,featured:true,status:"listed"}')"
    - >-
      curl --fail-with-body --silent --show-error
      --request POST
      --header "Authorization: ${MODRINTH_TOKEN}"
      --form "data=${MODRINTH_DATA};type=application/json"
        --form "file=@${RELEASE_FILE};type=application/java-archive"
        "https://api.modrinth.com/v2/version"

publish_gitlab_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build
      artifacts: true
    - job: publish_modrinth
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  before_script:
    - export RELEASE_VERSION="$(tr -d '\r\n' < version.txt)"
    - export RELEASE_DESCRIPTION="$(cat Description.txt)"
    - test -n "$RELEASE_VERSION"
    - test -n "$RELEASE_DESCRIPTION"
    - test -f "plugin/target/LeavesAntiIllegal-${RELEASE_VERSION}.jar"
  script:
    - export RELEASE_TAG="v${RELEASE_VERSION}"
    - export RELEASE_ASSET_URL="${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_SHA}/raw/plugin/target/LeavesAntiIllegal-${RELEASE_VERSION}.jar?job=build"
    - release-cli create --name "LeavesAntiIllegal ${RELEASE_VERSION}" --tag-name "$RELEASE_TAG" --ref "$CI_COMMIT_SHA" --description "$RELEASE_DESCRIPTION" --assets-link "{\"name\":\"LeavesAntiIllegal-${RELEASE_VERSION}.jar\",\"url\":\"${RELEASE_ASSET_URL}\"}"
