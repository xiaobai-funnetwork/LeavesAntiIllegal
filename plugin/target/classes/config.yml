# LeavesAntiIllegal 默认配置；适用于 Bukkit API 兼容服务端，修改后执行 /antiillegal reload 重载。
# 时间单位说明：20 tick = 1 秒；数值越小扫描越频繁，服务器开销也会越高。
config-version: 3 # 配置结构版本，仅用于识别配置代次；请勿手动改小，例如当前版本为 3。

# 是否向拥有 antiillegal.notify 权限的在线管理员发送违禁物通知；示例：false 表示只写控制台日志。
notify-admins: true # 默认 true；玩家本人不会收到重复的管理员通知。
# 是否把每次在线玩家或已加载容器的删除记录写入控制台；示例：false 可减少控制台刷屏。
log-to-console: true # 默认 true；离线数据扫描还有独立的逐物品日志开关。

# 所有消息均支持 & 颜色代码；可用占位符会在每一项上方说明。
messages: # 消息配置根节点；此行下方的缩进不可删除。
  # 玩家物品被移除时发送；可用 {item}=材料名、{location}=所在库存/槽位、{reason}=判定原因。
  item-removed: "&c[反作弊] &e你持有的违禁物品 &f{item} &e已被移除！ &7({reason})" # 示例物品：COMMAND_BLOCK。
  # 玩家违规时通知管理员；可用 {player}、{item}、{amount}、{location}、{reason}。
  admin-notify: "&c[反作弊] &e玩家 &f{player} &e在 &f{location} &e持有 &f{item} &e(x{amount})，已移除：&7{reason}" # 默认显示完整来源。
  # 已加载区块容器中发现违禁物时通知管理员；可用 {item}、{amount}、{location}、{reason}。
  container-admin-notify: "&c[反作弊] &e容器 &f{location} &e中的 &f{item} &e(x{amount}) 已移除：&7{reason}" # 位置包含世界和方块/实体坐标。
  # /antiillegal scan 完成后的消息；可用 {count}=本次删除的物品组数。
  scan-complete: "&a[反作弊] &e全服扫描完成，共移除 &f{count} &e个违禁物品" # 示例：{count}=3。
  # /antiillegal reload 真正重启全部扫描器后发送的消息；没有可替换占位符。
  reload-success: "&a[反作弊] &e配置与全部扫描器已重新加载" # 重载在 Bukkit 主线程执行，避免并发访问 Bukkit 状态。
  # 无 antiillegal.admin 权限执行管理命令时发送；没有可替换占位符。
  no-permission: "&c[反作弊] &e你没有权限执行此命令" # 可通过权限插件授予 antiillegal.admin。

# 扫描器总配置；在线玩家、嵌套容器、已加载区块、离线玩家数据均可独立开关和限速。
scanners: # 扫描器配置根节点；所有新增功能默认开启。
  # 在线玩家扫描使用 Bukkit 主线程定时任务，所有库存访问均保持线程安全。
  online-players: # 在线玩家背包与末影箱的定时扫描设置。
    # 是否定时扫描全部在线玩家；关闭后，拾取/点击等实时事件检测仍然工作。
    enabled: true # 默认 true；示例：临时排查性能时可设为 false。
    # 两次在线扫描之间的 tick 数；100 tick = 5 秒。
    interval-ticks: 100 # 默认 100；大型服务器可改为 200，即每 10 秒扫描一次。
    # 是否扫描玩家主背包、快捷栏、盔甲和副手。
    scan-inventory: true # 默认 true；关闭会显著降低保护范围，不建议关闭。
    # 是否扫描每名在线玩家的末影箱。
    scan-ender-chest: true # 默认 true；末影箱无需玩家打开也会被定时检查。
    # 是否检查玩家鼠标光标当前拿起的物品。
    scan-cursor: true # 默认 true；可拦截拖拽状态下暂未落槽的违禁物。

  # 嵌套容器指潜影盒、带方块状态库存的物品以及收纳袋中的物品。
  nested-containers: # 在线库存和离线 NBT 扫描都会使用此设置。
    # 是否递归检查容器物品内部，防止把违禁物藏在潜影盒或收纳袋中。
    enabled: true # 默认 true；示例：违禁命令方块藏在潜影盒中也会被移除。
    # 最大递归层数，用来限制恶意深层 NBT 带来的开销。
    max-depth: 3 # 默认 3；正常物品通常只需 1 层，不建议设置超过 5。

  # 已加载区块扫描不会加载新区块，只处理服务器当前已经加载的区块。
  loaded-containers: # 箱子、木桶、漏斗、熔炉、潜影盒方块和容器实体等设置。
    # 是否启用已加载区块容器扫描。
    enabled: true # 默认 true；关闭后玩家和离线数据扫描不受影响。
    # 每次抽取一批区块的间隔；200 tick = 10 秒。
    interval-ticks: 200 # 默认 200；区块很多时可保持间隔并调整 chunks-per-run。
    # 每个主线程批次最多处理多少个已加载区块，用于限制单 tick 工作量。
    chunks-per-run: 16 # 默认 16；例如 1600 个加载区块约需 100 个批次完成一轮。
    # 是否扫描箱子、木桶、漏斗、熔炉等方块实体库存。
    scan-block-containers: true # 默认 true；双箱会自动去重同一库存引用。
    # 是否扫描已加载的漏斗矿车、运输矿车等 InventoryHolder 实体。
    scan-entity-containers: true # 默认 true；不会为了扫描强制加载实体数据。
    # 仅扫描列出的世界；空列表 [] 表示扫描全部世界。
    included-worlds: [] # 示例：改成 ["world", "world_nether"] 可排除其他副本世界。
    # 多行世界列表示例；需要使用时删除下方行首的 #，并删除上面的 [] 配置行。
    # included-worlds: # 示例列表的键；与上面的 included-worlds 只能保留一个。
    #   - "world" # 示例：主世界目录名。
    #   - "world_nether" # 示例：下界目录名。

  # 离线扫描直接处理各世界 playerdata/<UUID>.dat；只在配置的低峰窗口分批执行。
  offline-player-data: # 离线背包、末影箱与其中嵌套容器的 NBT 扫描设置。
    # 是否启用低峰离线玩家数据遍历。
    enabled: true # 默认 true；第一次进入低峰窗口会扫描所有标准 UUID .dat 文件。
    # 低峰时间使用的 IANA 时区；system 表示操作系统时区。
    time-zone: "Asia/Shanghai" # 默认中国标准时间；示例："UTC" 或 "system"。
    # 每日低峰窗口开始时间，格式必须为 HH:mm。
    window-start: "04:00" # 默认凌晨 4 点；示例："23:30"。
    # 每日低峰窗口结束时间，格式必须为 HH:mm；早于开始时间表示跨午夜。
    window-end: "06:00" # 默认早上 6 点；示例：23:30 到 03:00 可跨日运行。
    # 检查当前是否进入低峰窗口的间隔，单位为秒，最小 30 秒。
    window-check-interval-seconds: 60 # 默认每分钟检查一次，不会每分钟重复完整扫描。
    # 两次成功完整遍历之间至少间隔多少个自然日。
    minimum-days-between-runs: 1 # 默认每天最多一次；示例：7 表示每周最多一次。
    # 在线人数高于此值时不启动或暂停离线批次，以避开业务高峰。
    max-online-players: 5 # 默认最多 5 人；设为 0 表示只有无人在线时才处理。
    # 每个异步批次最多读取和处理多少个玩家 .dat 文件。
    files-per-batch: 10 # 默认 10；磁盘较慢可降到 2，NVMe 可适当提高。
    # 两个离线文件批次之间的等待 tick；20 tick = 1 秒。
    batch-delay-ticks: 20 # 默认 20；提高此值可进一步降低持续磁盘压力。
    # 玩家退出后继续保护其 .dat 文件多少秒，等待服务器完成保存。
    safe-after-logout-seconds: 30 # 默认 30 秒；服务器存盘繁忙时可提高到 60。
    # 玩家进入预登录流程后最多保护其 .dat 文件多少秒，防止中途断线造成永久跳过。
    login-protection-seconds: 300 # 默认 300 秒；成功加入后会自动改为在线期间持续保护。
    # 修改原 .dat 前是否在同目录创建备份。
    backup-before-write: true # 默认 true；强烈建议保持开启，备份只在确实检出违禁物时创建。
    # 备份文件追加的后缀；同一玩家再次修改时覆盖该备份，避免无限占用磁盘。
    backup-suffix: ".fai.bak" # 示例：玩家文件 UUID.dat 的备份为 UUID.dat.fai.bak。
    # 演练模式只检测和记录，不写回 .dat，也不会创建备份。
    dry-run: false # 默认 false，即真正移除；首次部署可先设 true 观察日志。
    # 是否为离线文件中的每件违禁物输出详细路径和原因。
    log-each-removal: false # 默认 false，只输出每名玩家汇总；排查时可临时开启。
    # NBT 中遇到服务器当前注册表不存在的附魔时，允许的最高等级。
    unknown-enchant-max-level: 10 # 默认 10；例如未知附魔 32767 级仍会被识别为 32K。

# 以下为所有扫描器共用的物品判定规则。
# 是否检测超过附魔正常上限的“32K”物品。
check-overpowered-enchants: true # 默认 true；在线 Bukkit 物品与离线 NBT 同时生效。
# 普通附魔最大等级的倍率；允许等级 = 原版最大等级 × 此值。
enchant-max-multiplier: 1 # 默认 1；示例：2 会允许锋利 10，但不建议放宽。

# 特定附魔等级上限会覆盖上面的倍率；键支持 Bukkit 名称或 namespaced key。
custom-enchant-limits: # 默认没有覆盖项；下方均为注释示例。
  # SHARPNESS: 5 # 示例：锋利最高 5 级。
  # PROTECTION: 4 # 示例：保护最高 4 级。
  # "minecraft:efficiency": 5 # 示例：也可使用完整命名空间键。

# 是否检测负耐久或超过材料最大耐久 10 点以上的物品。
check-illegal-durability: true # 默认 true；额外 10 点容差用于避免边界格式差异。
# 是否检测数量小于 0 或超过材料原版最大堆叠数的物品。
check-illegal-stack-size: true # 默认 true；例如 64 把不可堆叠武器会被移除。
# 是否检测超出安全阈值的属性修饰器。
check-illegal-attributes: true # 默认 true；仅检查下面列出的七类关键属性。
# 是否把带不可破坏标记的物品视为违禁。
check-unbreakable: true # 默认 true；若服务器允许合法不可破坏道具，可设为 false。

# 属性修饰器使用绝对值比较；正负数只要绝对值超过上限都会被判定。
attribute-limits: # 在线 ItemMeta 和离线 NBT 共用这些阈值。
  # 攻击伤害修饰器绝对值上限。
  attack-damage: 50.0 # 示例：51.0 或 -51.0 均为违禁。
  # 攻击速度修饰器绝对值上限。
  attack-speed: 10.0 # 原版玩家基础攻击速度通常远低于该值。
  # 最大生命值修饰器绝对值上限。
  max-health: 200.0 # 200 点等于 100 颗心。
  # 移动速度修饰器绝对值上限。
  movement-speed: 1.0 # 原版玩家基础移动速度约为 0.1。
  # 护甲值修饰器绝对值上限。
  armor: 30.0 # 原版完整高阶护甲通常不超过该范围。
  # 护甲韧性修饰器绝对值上限。
  armor-toughness: 20.0 # 示例：21.0 会被判定为违禁。
  # 击退抗性修饰器绝对值上限。
  knockback-resistance: 1.0 # 1.0 表示 100% 击退抗性。

# 直接禁止的 Bukkit 材料名称；名称不区分大小写，写错会在启动日志告警。
banned-materials: # 下列项目在线、容器和离线数据扫描全部生效。
  - COMMAND_BLOCK # 命令方块，生存模式不可正常获取。
  - CHAIN_COMMAND_BLOCK # 连锁命令方块，生存模式不可正常获取。
  - REPEATING_COMMAND_BLOCK # 循环命令方块，生存模式不可正常获取。
  - COMMAND_BLOCK_MINECART # 命令方块矿车，可执行服务器命令。
  - STRUCTURE_BLOCK # 结构方块，管理与地图制作专用。
  - STRUCTURE_VOID # 结构空位，结构系统专用物品。
  - JIGSAW # 拼图方块，世界生成专用。
  - BARRIER # 屏障方块，正常生存玩法不可见且不可获取。
  - LIGHT # 光源方块，地图制作专用。
  - DEBUG_STICK # 调试棒，可修改方块状态。
  - KNOWLEDGE_BOOK # 知识之书，命令/数据包用途物品。
  - BEDROCK # 基岩，正常生存模式不可获取。
  - END_PORTAL_FRAME # 末地传送门框架，正常生存模式不可获取。
  - SPAWNER # 刷怪笼物品，默认生存模式不可获取。
  - PLAYER_HEAD # 玩家头颅；若服务器有合法头颅玩法，请删除此行。
  - BUDDING_AMETHYST # 紫水晶母岩，不可被正常精准采集。
  - REINFORCED_DEEPSLATE # 强化深板岩，正常生存模式不可获取。
  - PETRIFIED_OAK_SLAB # 石化橡木台阶，旧版/调试用途方块。
  - INFESTED_STONE # 被虫蚀的石头物品，默认不可正常获取。
  - INFESTED_COBBLESTONE # 被虫蚀的圆石物品，默认不可正常获取。
  - INFESTED_STONE_BRICKS # 被虫蚀的石砖物品，默认不可正常获取。
  - INFESTED_MOSSY_STONE_BRICKS # 被虫蚀的苔石砖物品，默认不可正常获取。
  - INFESTED_CRACKED_STONE_BRICKS # 被虫蚀的裂纹石砖物品，默认不可正常获取。
  - INFESTED_CHISELED_STONE_BRICKS # 被虫蚀的錾制石砖物品，默认不可正常获取。
  - INFESTED_DEEPSLATE # 被虫蚀的深板岩物品，默认不可正常获取。

# 完全跳过检测的玩家 UUID；在线时跳过背包/末影箱，离线时跳过对应 .dat。
whitelisted-players: [] # 示例：["00000000-0000-0000-0000-000000000000"]；玩家名无效，必须填 UUID。
# 多行白名单示例；需要使用时删除下方行首的 #，并删除上面的 [] 配置行。
# whitelisted-players: # 示例列表的键；与上面的 whitelisted-players 只能保留一个。
#   - "00000000-0000-0000-0000-000000000000" # 示例 UUID，请替换成真实玩家 UUID。
