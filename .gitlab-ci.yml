stages:
  - clean
  - build
  - release

variables:
  GIT_DEPTH: "1"
  GIT_TERMINAL_PROMPT: "0"
  GIT_HTTP_LOW_SPEED_LIMIT: "1024"
  GIT_HTTP_LOW_SPEED_TIME: "60"
  MAVEN_HOME: "/volume2/1/gitlab-runner/maven/apache-maven-3.9.16"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version --settings .mvn/settings.xml -Dmaven.wagon.http.connectionTimeout=30000 -Dmaven.wagon.http.readTimeout=60000"
  MAVEN_OPTS: "-Dmaven.repo.local=/volume2/1/gitlab-runner/m2/repository"

before_script:
  - export PATH="${MAVEN_HOME}/bin:/volume2/1/gitlab-runner/bin:${PATH}"
  - export BASE_VERSION="$(tr -d '\r\n' < version.txt)"
  - test -n "$BASE_VERSION"
  - export RELEASE_REVISION="$(date -u -d "$CI_PIPELINE_CREATED_AT" +%Y%m%d%H%M%S)"
  - export RELEASE_VERSION="${BASE_VERSION}-${RELEASE_REVISION}"
  - echo "Building LeavesAntiIllegal ${RELEASE_VERSION}"

clean:
  stage: clean
  script:
    - mvn ${MAVEN_CLI_OPTS} -Drevision="$RELEASE_VERSION" clean

build:
  stage: build
  needs:
    - clean
  script:
    - mvn ${MAVEN_CLI_OPTS} -Drevision="$RELEASE_VERSION" clean package -DskipTests
    - test -f "plugin/target/LeavesAntiIllegal-${RELEASE_VERSION}.jar"
  artifacts:
    name: "LeavesAntiIllegal-${RELEASE_VERSION}"
    expire_in: 30 days
    paths:
      - "plugin/target/LeavesAntiIllegal-*.jar"

publish_gitlab_release:
  stage: release
  needs:
    - job: build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - export PATH="/volume2/1/gitlab-runner/bin:${PATH}"
    - export BASE_VERSION="$(tr -d '\r\n' < version.txt)"
    - export RELEASE_REVISION="$(date -u -d "$CI_PIPELINE_CREATED_AT" +%Y%m%d%H%M%S)"
    - export RELEASE_VERSION="${BASE_VERSION}-${RELEASE_REVISION}"
    - export RELEASE_DESCRIPTION="$(cat Description.txt)"
    - test -n "$RELEASE_VERSION"
    - test -n "$RELEASE_DESCRIPTION"
    - test -f "plugin/target/LeavesAntiIllegal-${RELEASE_VERSION}.jar"
  script:
    - export RELEASE_TAG="v${RELEASE_VERSION}"
    - export RELEASE_ASSET_URL="${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_SHA}/raw/plugin/target/LeavesAntiIllegal-${RELEASE_VERSION}.jar?job=build"
    - release-cli create --name "LeavesAntiIllegal ${RELEASE_VERSION}" --tag-name "$RELEASE_TAG" --ref "$CI_COMMIT_SHA" --description "$RELEASE_DESCRIPTION" --assets-link "{\"name\":\"LeavesAntiIllegal-${RELEASE_VERSION}.jar\",\"url\":\"${RELEASE_ASSET_URL}\"}"
