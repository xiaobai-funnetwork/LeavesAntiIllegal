name: Build and Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  MAVEN_VERSION: '3.9.16'
  JAVA_VERSION: '17'

jobs:
  clean:
    name: Clean
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Maven
        shell: bash
        run: |
          set -euo pipefail
          maven_dir="$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}"
          curl --fail --location --retry 3 \
            "https://mirrors.aliyun.com/apache/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
            --output "$RUNNER_TEMP/apache-maven.tar.gz"
          tar -xzf "$RUNNER_TEMP/apache-maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$maven_dir/bin" >> "$GITHUB_PATH"

      - name: Run Maven clean
        shell: bash
        run: mvn --batch-mode --errors --show-version -s .mvn/settings.xml -Drevision="$(tr -d '\r\n' < version.txt)" clean

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: clean
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Maven
        shell: bash
        run: |
          set -euo pipefail
          maven_dir="$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}"
          curl --fail --location --retry 3 \
            "https://mirrors.aliyun.com/apache/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
            --output "$RUNNER_TEMP/apache-maven.tar.gz"
          tar -xzf "$RUNNER_TEMP/apache-maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$maven_dir/bin" >> "$GITHUB_PATH"

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < version.txt)" >> "$GITHUB_OUTPUT"

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --errors --show-version -s .mvn/settings.xml \
            -Drevision="${{ steps.version.outputs.version }}" clean package -DskipTests
          test -f "plugin/target/LeavesAntiIllegal-${{ steps.version.outputs.version }}.jar"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeavesAntiIllegal-${{ steps.version.outputs.version }}
          path: plugin/target/LeavesAntiIllegal-*.jar
          if-no-files-found: error

  release:
    name: Create Tag and GitHub Release
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < version.txt)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: LeavesAntiIllegal-${{ steps.metadata.outputs.version }}
          path: plugin/target

      - name: Create tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.metadata.outputs.version }}"
          tag="v${version}"
          file="plugin/target/LeavesAntiIllegal-${version}.jar"
          if git ls-remote --exit-code origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists. Update version.txt before publishing again."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$tag" "$GITHUB_SHA" --message "LeavesAntiIllegal ${version}"
          git push origin "$tag"
          gh release create "$tag" "$file" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LeavesAntiIllegal ${version}" \
            --notes-file Description.txt

  publish_modrinth:
    name: Publish to Modrinth
    runs-on: ubuntu-24.04
    needs: [build, release]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < version.txt)" >> "$GITHUB_OUTPUT"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: LeavesAntiIllegal-${{ steps.version.outputs.version }}
          path: plugin/target

      - name: Publish version
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          file="plugin/target/LeavesAntiIllegal-${version}.jar"
          test -f "$file"
          test -n "$MODRINTH_TOKEN"
          test -n "$MODRINTH_PROJECT_ID"
          game_versions='["1.20","1.20.1","1.20.2","1.20.3","1.20.4","1.20.5","1.20.6","1.21","1.21.1","1.21.2","1.21.3","1.21.4","1.21.5","1.21.6","1.21.7","1.21.8","1.21.9","1.21.10","1.21.11","26.1","26.1.1","26.1.2","26.2"]'
          jq -n --arg project "$MODRINTH_PROJECT_ID" --arg version "$version" --arg description "$(cat Description.txt)" --argjson game_versions "$game_versions" '{project_id:$project,version_number:$version,name:("LeavesAntiIllegal " + $version),version_type:"release",loaders:["bukkit","paper","spigot","purpur"],game_versions:$game_versions,file_parts:["LeavesAntiIllegal-" + $version + ".jar"],dependencies:[],changelog:$description,featured:true,status:"listed"}' > modrinth-data.json
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: ${MODRINTH_TOKEN}" \
            --form "data=@modrinth-data.json;type=application/json" \
            --form "file=@${file};type=application/java-archive" \
            "https://api.modrinth.com/v2/version"
